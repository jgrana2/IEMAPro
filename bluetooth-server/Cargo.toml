[package]
name = "bluetooth-server"
version = "0.1.0"
edition = "2021"

[dependencies]
btleplug = "0.11"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = "1.0"
futures-util = "0.3"
warp = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"

[lib]
name = "bluetooth_server"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/main.rs"
